# The sidebar menu. Each line is a page file, in the order you want it shown.
# The first page (about.md) is your homepage.
# Add a line to put a new page in the menu; delete a line to hide a page.
# Pages not listed here still exist, they just aren't in the menu.
- page: pages/about.md

- page: pages/notes.md
  children:
  - pages/notes/amath.md
  - pages/notes/pmath.md
  - pages/notes/ece.md
  - pages/notes/stat.md
  - pages/notes/comm.md

- page: pages/templates.md

- page: pages/contact.md
